<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;

        font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background: #f8f8f8;
        color: #333;
    }
    .aviso {
        max-width: 24rem;
        padding: 2rem;
        text-align: center;
    }
    .aviso img {
        width: 96px;
        height: 96px;
        margin-bottom: 1.5rem;
    }
    .aviso h1 {
        font-size: 1.375rem;
        font-weight: 600;
        margin: 0 0 .75rem;
    }
    .aviso p {
        line-height: 1.5;
        margin: 0 0 1.5rem;
        color: #666;
    }
    .aviso button {
        padding: .625rem 1.5rem;
        font-size: 1rem;
        color: #fff;
        background: #229ac8;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
    }
    .aviso button:hover {
        background: #1f90bb;
    }
</style>
</head>
<body>
<div class="aviso">
    <img src="image/pwa/icon-192.png" alt="">
    <h1>Sem conexão</h1>
    <p>Não foi possível carregar esta página. Verifique sua internet e tente novamente.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
