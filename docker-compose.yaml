version: '3.7'

volumes:
    ocbr_database:

networks:
    ocbr_network:

services:
    ocbr:
        container_name: opencartbrasil
        build:
          context: .docker
          dockerfile: Dockerfile
          args:
            VERSION: "1.x"
        ports:
            - ${HTTP_PORT:-8080}:80
        environment:
            - DB_HOSTNAME=ocbr_db
            - DB_USERNAME=${DB_USERNAME:-store}
            - DB_PASSWORD=${DB_PASSWORD:-store}
            - DB_DATABASE=${DB_DATABASE:-opencartbrasil}
            - USERNAME=${ADMIN_USERNAME:-admin}
            - PASSWORD=${ADMIN_PASSWORD:-admin}
            - HTTP_SERVER=${HTTP_SERVER:-http://localhost:${HTTP_PORT:-8080}/}
            # Endereco canonico da loja. Vazio, a URL sai do cabecalho Host,
            # que o cliente controla: bom para desenvolvimento, inseguro em
            # dominio publico. Defina no .env ao publicar a loja.
            - STORE_URL=${STORE_URL:-}
        networks:
            - ocbr_network
        volumes:
            - ./:/var/www/html
            - ../opencart-storage:/var/www/storage
        depends_on:
            - ocbr_db

    ocbr_db:
        image: mysql:5.7
        container_name: opencartbrasil_db
        environment:
            - MYSQL_RANDOM_ROOT_PASSWORD=yes
            - MYSQL_USER=${DB_USERNAME:-store}
            - MYSQL_PASSWORD=${DB_PASSWORD:-store}
            - MYSQL_DATABASE=${DB_DATABASE:-opencartbrasil}
        networks:
            - ocbr_network
        volumes:
            - ocbr_database:/var/lib/mysql